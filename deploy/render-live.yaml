# Render blueprint for the LIVE demo.
#
# Separate from render.yaml so one configuration stays safe by
# construction: render.yaml needs no credentials, this one needs four
# and spends real money at three independent providers.
#
# THREE COST DOMAINS, THREE SEPARATE LIMITS. They do not bound each
# other, and a limit on one will not stop the others:
#
#   1. OpenAI tokens      -> project spend limit in the OpenAI dashboard
#   2. Tavily credits     -> monthly credit limit on the Tavily key
#   3. Hugging Face NLI   -> hourly endpoint billing, which accrues
#                            whenever the endpoint is warm, whether or
#                            not anybody runs research
#
# The OpenAI limit is the only one a restart cannot bypass, and even it
# is not instantaneous -- treat it as a durable backstop, not an exact
# per-cent guarantee.
#
# THE WEB IMAGE STAYS SMALL. Dockerfile.web installs the [web] extra
# only: FastAPI and Uvicorn, no torch, no transformers. The verifier's
# measured peak is about 1.3 GB, which does not fit a 512 MB plan, so
# semantic verification runs on a private Hugging Face endpoint pinned
# to one checkpoint revision. See deploy/nli-service/.
#
# ACCEPTANCE ORDER. Deploy the endpoint with min replicas 1 and prove
# correctness warm. Only afterwards enable scale-to-zero and test the
# bounded 502/503 warm-up path.

services:
  - type: web
    name: agentic-research-engine-live
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: false

    envVars:
      # --- credentials: prompted at Blueprint creation, never committed ---
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Hugging Face token for the PRIVATE inference endpoint.
      - key: NLI_API_KEY
        sync: false
      # Redis / Render Key Value URL backing the durable run cap.
      - key: DEMO_QUOTA_URL
        sync: false

      # --- live switches ---
      - key: LIVE_RESEARCH_ENABLED
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: LLM_MODE
        value: cloud
      - key: ALLOW_CLOUD_FALLBACK
        value: "false"

      # The model is a deployment decision, not a default baked into the
      # code. Preflight retrieves it before the first paid call and
      # refuses to start if the project cannot see it or if pricing.toml
      # carries no verified price for it.
      - key: OPENAI_MODEL
        sync: false
      - key: OPENAI_FAST_MODEL
        sync: false

      - key: SEARCH_PROVIDER
        value: tavily
      - key: SEARCH_DEPTH
        value: basic

      # --- remote verifier: pinned, private, fail-closed ---
      - key: NLI_MODE
        value: remote
      # Base URL of the private endpoint. No /score suffix: the managed
      # handler is served from the root, unlike deploy/nli-service.
      - key: NLI_ENDPOINT
        sync: false
      # The managed endpoint runs the stock text-classification handler,
      # which echoes neither the model nor a truncation flag. Choosing
      # this dialect moves the revision check to preflight, against the
      # Hugging Face control plane, and measures truncation in-process.
      - key: NLI_DIALECT
        value: hf
      - key: NLI_MODEL_ID
        value: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
      # The exact commit the 0.98 threshold was calibrated against. A
      # different revision is a different verifier.
      - key: NLI_MODEL_REVISION
        value: b3546ea6b0346eb6f8d5d68b13c7dc6d0376b3d7
      - key: NLI_SUPPORT_THRESHOLD
        value: "0.98"
      - key: NLI_TIMEOUT_SECONDS
        value: "45"
      # 0 until warm acceptance passes. Raise this only when enabling
      # scale-to-zero: a cold endpoint answers 502 for roughly half a
      # minute, and at 0 the first run after an idle period withholds
      # every claim rather than waiting.
      - key: NLI_SCALE_UP_TIMEOUT_SECONDS
        value: "0"

      # --- durable quota ---
      # Refuse live research rather than fall back to a process-local
      # counter a cold start resets.
      - key: DEMO_QUOTA_REQUIRED
        value: "true"
      # Render terminates TLS and appends one X-Forwarded-For entry.
      - key: TRUSTED_PROXY_HOPS
        value: "1"

      # --- per-run ceilings, reserved before dispatch ---
      - key: MAX_CLOUD_COST_USD
        value: "0.05"
      - key: MAX_CLOUD_CALLS
        value: "20"
      - key: MAX_CLOUD_INPUT_TOKENS
        value: "120000"
      - key: MAX_CLOUD_OUTPUT_TOKENS
        value: "20000"
      - key: MAX_SEARCH_CREDITS
        value: "8"
      - key: MAX_PROVIDER_REQUESTS
        value: "30"
      # Conservative view of the provider account quota the per-day run
      # cap is derived from. Raise only alongside the provider plan.
      - key: DEMO_PROVIDER_REQUESTS_PER_DAY
        value: "50"

      # --- run shape ---
      - key: MAX_RESEARCH_ROUNDS
        value: "1"
      - key: MAX_SOURCES
        value: "6"
      - key: MAX_SOURCES_PER_ROUND
        value: "6"
      - key: MAX_SEARCH_QUERIES
        value: "6"
      - key: MAX_LLM_CALLS
        value: "20"

      # --- demo throttles (secondary to the durable cap) ---
      - key: DEMO_MAX_CONCURRENT_RUNS
        value: "1"
      - key: DEMO_RUNS_PER_HOUR
        value: "2"
      # Hard wall-clock ceiling for one public run.
      - key: DEMO_MAX_RUNTIME_SECONDS
        value: "240"

      # --- runtime ---
      - key: PERSIST_RUNS
        value: "false"
      - key: CHECKPOINT_BACKEND
        value: memory
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
