# Render blueprint for the LIVE demo.
#
# Separate from render.yaml so one configuration stays safe by
# construction: render.yaml needs no credentials, this one needs four
# and spends real money at three independent providers.
#
# THREE COST DOMAINS, THREE SEPARATE LIMITS. They do not bound each
# other, and a limit on one will not stop the others:
#
#   1. OpenAI tokens      -> project spend limit in the OpenAI dashboard
#   2. Tavily credits     -> monthly credit limit on the Tavily key
#   3. Hugging Face NLI   -> hourly endpoint billing, which accrues
#                            whenever the endpoint is warm, whether or
#                            not anybody runs research
#
# The OpenAI limit is the only one a restart cannot bypass, and even it
# is not instantaneous -- treat it as a durable backstop, not an exact
# per-cent guarantee.
#
# THE WEB IMAGE STAYS SMALL. Dockerfile.web installs the [web] extra
# only: FastAPI and Uvicorn, no torch, no transformers. The verifier's
# measured peak is about 1.3 GB, which does not fit a 512 MB plan, so
# semantic verification runs on a private Hugging Face endpoint pinned
# to one checkpoint revision. See deploy/nli-service/.
#
# ACCEPTANCE ORDER. Deploy the endpoint with min replicas 1 and prove
# correctness warm. Only afterwards enable scale-to-zero and test the
# bounded 502/503 warm-up path.

services:
  - type: web
    # agentic-research-engine-live, not agentic-research-engine.
    #
    # The shorter name was tried and reverted. A Render service name is
    # what the blueprint matches an existing service by, so changing it
    # here is not a rename -- it reads as "delete that service, create a
    # different one", which Render declines to do on a sync. Two syncs
    # produced nothing at all.
    #
    # Changing it is therefore a full teardown and rebuild, with every
    # credential re-entered, for a cosmetically shorter hostname. Not
    # worth it. The replay blueprint keeps the descriptive
    # -replay suffix it gained, which was a real improvement.
    name: agentic-research-engine-live
    runtime: docker
    # Pinned explicitly. Render's rule for an omitted branch is "use the
    # Blueprint's branch" when the service lives in the same repository,
    # which means the branch the Blueprint instance happened to be
    # created from -- invisible in this file and impossible to review.
    # This deployment was created from feat/live-research and would have
    # kept deploying from it after the merge.
    branch: main
    dockerfilePath: ./Dockerfile.web
    plan: free
    region: oregon
    # Readiness, not liveness. /api/health answers 200 on an instance
    # that is configured for live research and cannot serve it, because
    # liveness only asks whether the process is up. /api/readiness
    # answers 503 in that state, so a bad deploy fails here rather than
    # going green and turning every visitor away.
    healthCheckPath: /api/readiness
    # autoDeploy: false is deprecated; autoDeployTrigger takes precedence
    # when both are present. Quoted because YAML 1.1 parses a bare off
    # as the boolean false, and the value Render expects here is the
    # string "off".
    autoDeployTrigger: "off"

    envVars:
      # --- credentials: prompted at Blueprint creation, never committed ---
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Hugging Face token for the PRIVATE inference endpoint.
      - key: NLI_API_KEY
        sync: false
      # Wired from the Key Value service defined below rather than
      # pasted in, so the two cannot drift and the connection string is
      # never handled by a person.
      - key: DEMO_QUOTA_URL
        fromService:
          name: agentic-research-quota
          type: keyvalue
          property: connectionString

      # --- live switches ---
      - key: LIVE_RESEARCH_ENABLED
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: LLM_MODE
        value: cloud
      - key: ALLOW_CLOUD_FALLBACK
        value: "false"

      # The model is a deployment decision, not a default baked into the
      # code. Preflight retrieves it before the first paid call and
      # refuses to start if the project cannot see it or if pricing.toml
      # carries no verified price for it.
      - key: OPENAI_MODEL
        sync: false
      - key: OPENAI_FAST_MODEL
        sync: false

      - key: SEARCH_PROVIDER
        value: tavily
      - key: SEARCH_DEPTH
        value: basic

      # --- remote verifier: pinned, private, fail-closed ---
      - key: NLI_MODE
        value: remote
      # Base URL of the private endpoint. No /score suffix: the managed
      # handler is served from the root, unlike deploy/nli-service.
      - key: NLI_ENDPOINT
        sync: false
      # The managed endpoint runs the stock text-classification handler,
      # which echoes neither the model nor a truncation flag. Choosing
      # this dialect moves the revision check to preflight, against the
      # Hugging Face control plane, and measures truncation in-process.
      - key: NLI_DIALECT
        value: hf
      - key: NLI_MODEL_ID
        value: MoritzLaurer/DeBERTa-v3-large-mnli-fever-anli-ling-wanli
      # The exact commit the 0.98 threshold was calibrated against. A
      # different revision is a different verifier.
      - key: NLI_MODEL_REVISION
        value: b3546ea6b0346eb6f8d5d68b13c7dc6d0376b3d7
      - key: NLI_SUPPORT_THRESHOLD
        value: "0.98"
      - key: NLI_TIMEOUT_SECONDS
        value: "45"
      # Scale-to-zero is enabled on the endpoint (min replicas 0, max 1),
      # so the first run after a quiet period arrives at nothing and has
      # to wait for a replica. At 0 that run withholds every claim.
      #
      # 90s, chosen from measurement rather than taste: a real cold start
      # on this 4GB CPU endpoint took 49.2s on 2026-09-27, and 90 leaves
      # roughly 80% margin for a slower one. It is deliberately well
      # under half of DEMO_MAX_RUNTIME_SECONDS, because the wake happens
      # *inside* the run's wall-clock ceiling -- a 90s wake leaves 150s
      # for planning, search, extraction, verification and synthesis.
      #
      # That 150s remainder is not yet proven sufficient under the
      # public budgets. The one local run took 237s at roughly double
      # this budget, with a warm endpoint. Measuring it is the first
      # job of hosted acceptance; if 240 turns out to be too tight, the
      # number to change is DEMO_MAX_RUNTIME_SECONDS, with evidence.
      - key: NLI_SCALE_UP_TIMEOUT_SECONDS
        value: "90"

      # --- durable quota ---
      # Refuse live research rather than fall back to a process-local
      # counter a cold start resets.
      - key: DEMO_QUOTA_REQUIRED
        value: "true"
      # Render terminates TLS and appends one X-Forwarded-For entry.
      - key: TRUSTED_PROXY_HOPS
        value: "1"

      # --- per-run ceilings, reserved before dispatch ---
      - key: MAX_CLOUD_COST_USD
        value: "0.05"
      - key: MAX_CLOUD_CALLS
        value: "20"
      # Denominated in the byte bound the reservation now uses, which
      # over-reserves 2x to 6x. 120000 was sized when the reservation
      # estimated real tokens, so the change of denominator made it
      # about six times tighter: at the worst measured prose ratio a
      # public run reserves roughly 110,600 of it. Raised for headroom,
      # not to widen spending -- MAX_CLOUD_COST_USD is unchanged.
      - key: MAX_CLOUD_INPUT_TOKENS
        value: "240000"
      - key: MAX_CLOUD_OUTPUT_TOKENS
        value: "20000"
      - key: MAX_SEARCH_CREDITS
        value: "8"
      - key: MAX_PROVIDER_REQUESTS
        value: "30"
      # The operator-configured daily provider-request budget. This is
      # a number the operator chooses, not a quota read from OpenAI:
      # nothing here queries the account, and OpenAI publishes no
      # per-day request allowance this could be derived from. Naming it
      # after the provider made it sound discovered.
      #
      # 240 with MAX_PROVIDER_REQUESTS=30 admits eight runs a day
      # (240 // 30). Raised from 150 (five) on 2026-09-29, once four
      # hosted runs had been measured.
      #
      # WHAT A RUN ACTUALLY COSTS. Those four used 14, 12, 13 and 13
      # provider requests and $0.0085, $0.0093, $0.0081 and $0.0085 --
      # roughly a fifth of the $0.05 per-run ceiling the budget is
      # sized against. Eight runs is therefore about $0.07/day at the
      # measured rate and $0.40/day at the reserved worst case.
      #
      # WHY NOT LOWER MAX_PROVIDER_REQUESTS INSTEAD. Deriving the cap
      # from a tighter per-run ceiling would buy the same runs for a
      # smaller budget -- 150 // 20 is seven. It is not done, because
      # that number is also the hard ceiling a single run is cut off
      # at, and a run truncated mid-flight is worse than one fewer run
      # a day. 30 stays as roughly twice the observed maximum.
      #
      # WHY MORE RUNS AT ALL. Quota is reserved before dispatch and is
      # not refunded when a run fails, deliberately -- a refund path is
      # how a broken loop spends a whole budget. On 2026-09-29 two of
      # five admissions produced nothing (one crashed at the coverage
      # critique, one was killed by a redeploy mid-wake), so debugging
      # spends the allowance about twice as fast as it reads.
      #
      # The $5 project cap remains the financial backstop: about 590
      # runs at the measured rate. Tavily credits and Hugging Face
      # endpoint uptime are billed separately and bounded separately.
      - key: DEMO_PROVIDER_REQUESTS_PER_DAY
        value: "240"

      # --- run shape ---
      - key: MAX_RESEARCH_ROUNDS
        value: "1"
      - key: MAX_SOURCES
        value: "6"
      - key: MAX_SOURCES_PER_ROUND
        value: "6"
      - key: MAX_SEARCH_QUERIES
        value: "6"
      - key: MAX_LLM_CALLS
        value: "20"

      # --- demo throttles (secondary to the durable cap) ---
      - key: DEMO_MAX_CONCURRENT_RUNS
        value: "1"
      - key: DEMO_RUNS_PER_HOUR
        value: "2"
      # Hard wall-clock ceiling for one public run.
      - key: DEMO_MAX_RUNTIME_SECONDS
        value: "240"

      # --- runtime ---
      - key: PERSIST_RUNS
        value: "false"
      - key: CHECKPOINT_BACKEND
        value: memory
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json

  # --- durable run counter -------------------------------------------
  #
  # The global daily cap lives here rather than in web-process memory.
  # A free web instance sleeps when idle and wakes with a fresh counter,
  # so an in-memory cap bounds a process rather than a day. One atomic
  # INCR against this store is shared by every web replica and survives
  # a web restart.
  #
  # WHAT THE FREE PLAN DOES NOT GIVE YOU. Render's documentation is
  # explicit: "Data persistence is not available for free Key Value
  # instances." The counter is therefore shared, and it is not durable
  # across a restart of this store -- a Key Value restart returns the
  # day's allowance to zero used.
  #
  # So on the free plan the financial backstop is the provider-side
  # limit on the OpenAI project, not this counter. For a cap that
  # survives its own store, use a paid plan with journal + snapshot
  # persistence and only then describe it as durable.
  - type: keyvalue
    name: agentic-research-quota
    plan: free
    region: oregon
    # Reachable only from services in this blueprint. The counter holds
    # no secret, but an internet-reachable store is an invitation to
    # have the day's allowance spent for you.
    ipAllowList: []
