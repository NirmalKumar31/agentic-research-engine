# Render blueprint for the LIVE demo: recorded runs and a real research box.
#
# Separate from render.yaml so one configuration stays safe by construction:
# render.yaml needs no credentials, this one needs two and spends real money.
#
# What bounds the spend, in increasing order of trustworthiness:
#   1. Per run: the MAX_CLOUD_* ceilings below are reserved before each
#      provider request is sent, so one run cannot exceed them.
#   2. Per day: DEMO_PROVIDER_REQUESTS_PER_DAY / MAX_CLOUD_CALLS. This
#      counter is process-local, and Render Free resets it on every cold
#      start, so it cannot bound an account-level quota.
#   3. Your OpenAI account limit. The only one a restart cannot bypass.
#
# SET A HARD MONTHLY BUDGET IN THE OPENAI DASHBOARD BEFORE DEPLOYING.
#
# The server clamps every value here to its own DemoLimits maximum, so a
# raised value has no effect; a lowered one does.

services:
  - type: web
    name: agentic-research-live
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: false

    envVars:
      # Render prompts for these at Blueprint creation; never committed.
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

      # Live research needs a reachable model, and Render has no Ollama.
      - key: LIVE_RESEARCH_ENABLED
        value: "true"
      - key: LLM_MODE
        value: cloud
      - key: DEMO_MODE
        value: "true"

      # Luna only. Fallback off so an unreachable model fails rather than
      # escalating to a more expensive one.
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_FAST_MODEL
        value: gpt-6-luna
      - key: ALLOW_CLOUD_FALLBACK
        value: "false"
      - key: SEARCH_PROVIDER
        value: tavily

      # Per-run ceilings, reserved before dispatch.
      - key: MAX_CLOUD_CALLS
        value: "20"
      - key: MAX_CLOUD_COST_USD
        value: "0.05"
      - key: MAX_CLOUD_INPUT_TOKENS
        value: "120000"
      - key: MAX_CLOUD_OUTPUT_TOKENS
        value: "20000"
      - key: MAX_SEARCH_CREDITS
        value: "8"
      # All provider HTTP requests in one run, search included.
      - key: MAX_PROVIDER_REQUESTS
        value: "30"

      # How much work one run may do.
      - key: MAX_RESEARCH_ROUNDS
        value: "1"
      - key: MAX_SOURCES
        value: "6"
      - key: MAX_SOURCES_PER_ROUND
        value: "6"
      - key: MAX_SEARCH_QUERIES
        value: "6"
      - key: MAX_LLM_CALLS
        value: "20"
      - key: SEARCH_DEPTH
        value: basic

      # One run at a time: a free instance has little CPU.
      - key: DEMO_MAX_CONCURRENT_RUNS
        value: "1"
      - key: DEMO_RUNS_PER_HOUR
        value: "2"
      # Account-level quota the daily run cap is derived from. Raise only
      # when the OpenAI tier actually rises; above the real tier, visitors
      # hit a provider 429 mid-run instead of an honest refusal up front.
      - key: DEMO_PROVIDER_REQUESTS_PER_DAY
        value: "50"
      # Caps how long one run may hold the single slot.
      - key: DEMO_MAX_RUNTIME_SECONDS
        value: "240"

      # Ephemeral filesystem; persisting is pointless and slow here.
      - key: PERSIST_RUNS
        value: "false"
      - key: CHECKPOINT_BACKEND
        value: memory
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
