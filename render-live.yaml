# Render blueprint for the LIVE demo: recorded runs *and* a real research box.
#
# Deliberately a separate file. render.yaml stays the safe zero-credential
# replay deployment; weakening it to add live research would mean there was
# no longer a configuration that is safe by construction. Deploy whichever
# one you want, and the difference is visible in the filename rather than
# buried in a dashboard override.
#
# This one needs two API keys and spends real money. Read the ceilings
# below before creating it.
#
# ---------------------------------------------------------------------
# WHAT ACTUALLY BOUNDS THE SPEND
# ---------------------------------------------------------------------
# Three limits, in increasing order of trustworthiness:
#
#   1. Per run, in process: MAX_CLOUD_CALLS, MAX_CLOUD_COST_USD and the
#      token ceilings are reserved *before* each provider request is sent,
#      so a single run cannot exceed them. Reliable.
#
#   2. Per day, in process: DEMO_PROVIDER_REQUESTS_PER_DAY divided by
#      MAX_CLOUD_CALLS gives the daily run cap -- currently 50/20 = 2 runs.
#      This counter lives in memory. Render Free sleeps when idle, and a
#      cold start resets it. Best effort, not a guarantee.
#
#   3. Your OpenAI account limits. This is the one that cannot be bypassed
#      by a restart, and it is the real backstop.
#
# SET A HARD MONTHLY BUDGET IN THE OPENAI DASHBOARD BEFORE DEPLOYING THIS.
# Settings -> Limits. Five dollars is generous: a run costs about $0.008.
#
# Adding credit to OpenAI also raises your rate limits, and the daily run
# cap follows automatically because it is derived from
# DEMO_PROVIDER_REQUESTS_PER_DAY rather than hardcoded. Raise that value to
# match whatever your tier actually allows -- never above it, or visitors
# hit a provider 429 mid-run instead of an honest refusal up front.

services:
  - type: web
    name: agentic-research-live
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: false

    envVars:
      # --- secrets: Render prompts for these, never committed -----------
      # sync:false means Render asks for the value when the Blueprint is
      # created. Nothing is stored in git.
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

      # --- live research on, and cloud because Render has no Ollama -----
      # These two belong together. LLM_MODE=local with live research
      # enabled would fail preflight on the very first request.
      - key: LIVE_RESEARCH_ENABLED
        value: "true"
      - key: LLM_MODE
        value: cloud

      # Server-controlled ceilings. A client value can only ever make a run
      # smaller, never larger.
      - key: DEMO_MODE
        value: "true"

      # --- models: Luna only --------------------------------------------
      # Both roles point at the cheap model. Sol and Astra are never used
      # here; the fast model is the same one on purpose.
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_FAST_MODEL
        value: gpt-6-luna
      # A missing or unreachable model must fail, not quietly escalate to
      # a more expensive one.
      - key: ALLOW_CLOUD_FALLBACK
        value: "false"
      - key: SEARCH_PROVIDER
        value: tavily

      # --- per-run spend ceilings, checked before dispatch --------------
      - key: MAX_CLOUD_CALLS
        value: "20"
      - key: MAX_CLOUD_COST_USD
        value: "0.05"
      - key: MAX_CLOUD_INPUT_TOKENS
        value: "120000"
      - key: MAX_CLOUD_OUTPUT_TOKENS
        value: "20000"
      - key: MAX_SEARCH_CREDITS
        value: "8"

      # --- how much work one run may do ---------------------------------
      - key: MAX_RESEARCH_ROUNDS
        value: "1"
      - key: MAX_SOURCES
        value: "6"
      - key: MAX_SOURCES_PER_ROUND
        value: "6"
      - key: MAX_SEARCH_QUERIES
        value: "6"
      - key: MAX_LLM_CALLS
        value: "20"
      - key: SEARCH_DEPTH
        value: basic

      # --- traffic shaping ----------------------------------------------
      # One at a time: a free instance has little CPU, and two concurrent
      # runs would make both slow rather than serving two people well.
      - key: DEMO_MAX_CONCURRENT_RUNS
        value: "1"
      - key: DEMO_RUNS_PER_HOUR
        value: "2"
      # The account-level quota the daily run cap is derived from. Raise
      # this only when your OpenAI tier actually rises.
      - key: DEMO_PROVIDER_REQUESTS_PER_DAY
        value: "50"
      # A cloud run took 76s when measured. 240s leaves room for a slow
      # one without holding the single run slot indefinitely.
      - key: DEMO_MAX_RUNTIME_SECONDS
        value: "240"

      # --- ephemeral by design -------------------------------------------
      - key: PERSIST_RUNS
        value: "false"
      - key: CHECKPOINT_BACKEND
        value: memory
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
