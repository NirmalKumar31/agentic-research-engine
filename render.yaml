# Render blueprint for the public replay demo.
#
# This Blueprint declares NO secrets, and needs none. The public site is
# replay-only: it serves research runs recorded earlier and committed
# inside the package, so it calls no model and no search provider. There is
# deliberately no TAVILY_API_KEY or OPENAI_API_KEY entry here -- every
# sync:false variable prompts for a value at Blueprint creation, which
# would demand two credentials for a site that uses neither.
#
# Free instances have limited CPU and RAM, spin down when idle and use an
# ephemeral filesystem. A cold start after inactivity takes roughly a
# minute. Replay makes that cheap rather than merely tolerable: the request
# that wakes the service spends no API credit at all.
#
# This is a portfolio demo, not production infrastructure: no persistence,
# in-memory checkpointing, and no local model server.

services:
  - type: web
    name: agentic-research-engine
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: false

    envVars:
      # --- live research is off, and that is the point ------------------
      # The daily run cap lives in process memory. A free instance spins
      # down when idle, and every cold start resets it, so it cannot bound
      # a 50-request/day account quota. Per-run request and spend ceilings
      # still hold; the cross-restart daily budget does not. The site
      # therefore serves recorded runs, which costs nothing and cannot be
      # exhausted. Enabling this without a persistent atomic quota store
      # means handing the API budget to anyone who finds the URL.
      - key: LIVE_RESEARCH_ENABLED
        value: "false"

      # --- no secrets, deliberately --------------------------------------
      # TAVILY_API_KEY and OPENAI_API_KEY are absent rather than declared
      # with sync:false. Every sync:false variable prompts for a value when
      # the Blueprint is created, so declaring them would demand two
      # credentials from someone deploying a site that never calls either
      # provider -- including someone who has no account with them.
      #
      # To enable live research later: add OPENAI_API_KEY and
      # TAVILY_API_KEY in the Render Dashboard, then set LLM_MODE=cloud and
      # LIVE_RESEARCH_ENABLED=true together. Read the note on LLM_MODE
      # below before doing so.

      # --- hosted demo posture ------------------------------------------
      - key: DEMO_MODE
        value: "true"
      # No model is used while the service only replays recordings, and
      # LLM_MODE=cloud would refuse to start without OPENAI_API_KEY --
      # failing the deploy on a credential the replay site never touches.
      # Set this to `cloud` at the same time as LIVE_RESEARCH_ENABLED=true,
      # never separately: there is no Ollama on a free instance, so `local`
      # plus live research would fail preflight on the first request.
      - key: LLM_MODE
        value: local
      # Start on the cheap model. Validate cost before considering Sol.
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_FAST_MODEL
        value: gpt-6-luna
      - key: ALLOW_CLOUD_FALLBACK
        value: "false"

      # --- spend ceilings, enforced before dispatch ----------------------
      - key: MAX_CLOUD_COST_USD
        value: "0.05"
      - key: MAX_CLOUD_CALLS
        value: "20"
      - key: MAX_CLOUD_INPUT_TOKENS
        value: "120000"
      - key: MAX_CLOUD_OUTPUT_TOKENS
        value: "20000"
      - key: MAX_SEARCH_CREDITS
        value: "8"
      # Measured on the validation account: gpt-6-luna allowed 50 requests
      # per day and one run costs ~22. Raise this only when the plan is
      # raised; the daily run cap is derived from it.
      - key: DEMO_PROVIDER_REQUESTS_PER_DAY
        value: "50"

      # --- run shape -----------------------------------------------------
      - key: MAX_RESEARCH_ROUNDS
        value: "1"
      - key: MAX_SOURCES
        value: "6"
      - key: MAX_SOURCES_PER_ROUND
        value: "6"
      - key: MAX_SEARCH_QUERIES
        value: "6"
      - key: MAX_LLM_CALLS
        value: "20"
      - key: SEARCH_DEPTH
        value: basic

      # --- ephemeral by design -------------------------------------------
      - key: PERSIST_RUNS
        value: "false"
      - key: CHECKPOINT_BACKEND
        value: memory
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
