# Render blueprint for the public replay demo.
#
# Declares NO secrets and needs none. The site is replay-only: it serves
# research runs recorded earlier and committed inside the package, so it
# calls no model and no search provider. Every sync:false variable prompts
# for a value at Blueprint creation, so declaring the two API keys would
# demand credentials for a site that uses neither.
#
# Free instances spin down when idle; a cold start takes roughly a minute.
# Replay makes that cheap, because waking the service spends nothing.
#
# For the live variant, deploy deploy/render-live.yaml instead.

services:
  - type: web
    name: agentic-research-engine
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: false

    envVars:
      # Off because the daily run cap is process-local and a free instance
      # resets it on every cold start, so it cannot bound an account-level
      # quota. Per-run ceilings are unaffected.
      - key: LIVE_RESEARCH_ENABLED
        value: "false"

      - key: DEMO_MODE
        value: "true"
      # Replay reaches no model. LLM_MODE=cloud would refuse to start
      # without OPENAI_API_KEY, failing the deploy on a credential this
      # site never uses. To go live, set this to `cloud` and
      # LIVE_RESEARCH_ENABLED=true together -- there is no Ollama here, so
      # `local` plus live research fails preflight on the first request.
      - key: LLM_MODE
        value: local
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: OPENAI_FAST_MODEL
        value: gpt-6-luna
      - key: ALLOW_CLOUD_FALLBACK
        value: "false"

      # Per-run ceilings, reserved before dispatch. Inert while replaying;
      # they apply the moment live research is enabled.
      - key: MAX_CLOUD_COST_USD
        value: "0.05"
      - key: MAX_CLOUD_CALLS
        value: "20"
      - key: MAX_CLOUD_INPUT_TOKENS
        value: "120000"
      - key: MAX_CLOUD_OUTPUT_TOKENS
        value: "20000"
      - key: MAX_SEARCH_CREDITS
        value: "8"
      - key: MAX_PROVIDER_REQUESTS
        value: "30"
      # Conservative configured value for the account quota the daily run
      # cap is derived from. Raise only with the provider plan.
      - key: DEMO_PROVIDER_REQUESTS_PER_DAY
        value: "50"

      # Run shape.
      - key: MAX_RESEARCH_ROUNDS
        value: "1"
      - key: MAX_SOURCES
        value: "6"
      - key: MAX_SOURCES_PER_ROUND
        value: "6"
      - key: MAX_SEARCH_QUERIES
        value: "6"
      - key: MAX_LLM_CALLS
        value: "20"
      - key: SEARCH_DEPTH
        value: basic

      # Ephemeral filesystem; persisting is pointless and slow here.
      - key: PERSIST_RUNS
        value: "false"
      - key: CHECKPOINT_BACKEND
        value: memory
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
