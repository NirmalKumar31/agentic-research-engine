# gitleaks configuration.
#
# Extends the default ruleset rather than replacing it, and adds rules for
# the providers this project actually uses. gitleaks ships no Tavily rule,
# so without the first rule below an accidentally committed search key would
# pass a "clean" scan.

[extend]
useDefault = true

[[rules]]
id = "tavily-api-key"
description = "Tavily API key"
regex = '''tvly-[A-Za-z0-9_-]{24,}'''
keywords = ["tvly-"]

[[rules]]
id = "openai-api-key-broad"
description = "OpenAI API key (project or legacy form)"
regex = '''sk-(proj-|svcacct-)?[A-Za-z0-9_-]{32,}'''
keywords = ["sk-"]

[allowlist]
regexTarget = "match"
description = "Paths and literals that are intentionally secret-shaped"
paths = [
  '''\.venv/''',
  '''\.env\.example$''',
  '''\.gitleaks\.toml$''',
]
regexes = [
  # Test fixtures. One exists specifically to assert that a secret is
  # redacted in logs, which requires a secret-shaped literal to exist.
  '''tvly-test-key''',
  # Present in commit e06b508 only: a test fixture asserting the API does
  # not echo a key back to the client. Never a real credential, so nothing
  # to rotate. The current tests use tvly-test-key instead, and this entry
  # exists solely so the history scan stays clean without rewriting shared
  # history over a string that was always fake.
  '''tvly-secret-value-for-testing-only''',
  '''tvly-supersecret''',
  '''tvly-x''',
  '''sk-test''',
  '''sk-x''',
  '''brave-key''',
  # Present in commit c1f354e only: parametrised fixtures asserting that the
  # recording loader rejects credential-*shaped* values, which required
  # credential-shaped literals to exist. Always fake, nothing to rotate.
  # tests/unit/test_replay_mode.py now assembles these from fragments at
  # runtime so no further literal enters history; these two entries keep the
  # history scan clean without rewriting shared history over strings that
  # were never real.
  # Matched on the distinctive body rather than the whole literal: the rule
  # captures a slightly wider span than the string itself, so an exact-
  # literal entry silently failed to suppress it.
  '''AbCdEfGhIjKlMnOpQrStUvWxYz0123456789''',
  '''tvly-AbCdEfGh01234567890123456789''',
]
