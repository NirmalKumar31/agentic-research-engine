# gitleaks configuration.
#
# Extends the default ruleset rather than replacing it, and adds rules for
# the providers this project actually uses. gitleaks ships no Tavily rule,
# so without the first rule below an accidentally committed search key would
# pass a "clean" scan.

[extend]
useDefault = true

[[rules]]
id = "tavily-api-key"
description = "Tavily API key"
regex = '''tvly-[A-Za-z0-9_-]{24,}'''
keywords = ["tvly-"]

[[rules]]
id = "openai-api-key-broad"
description = "OpenAI API key (project or legacy form)"
regex = '''sk-(proj-|svcacct-)?[A-Za-z0-9_-]{32,}'''
keywords = ["sk-"]

# Uses [[allowlists]] rather than the singular [allowlist]. The two cannot
# coexist -- gitleaks fails to load the config entirely, which surfaces as
# a scan that appears to run and reports whatever it likes. Worth knowing:
# a broken config does not look like a broken config.

[[allowlists]]
description = "Paths that are intentionally secret-shaped"
paths = [
  '''\.venv/''',
  '''\.env\.example$''',
  '''\.gitleaks\.toml$''',
]

[[allowlists]]
description = "Fake literals in test fixtures and historical commits"
regexes = [
  # Test fixtures. One exists specifically to assert that a secret is
  # redacted in logs, which requires a secret-shaped literal to exist.
  '''tvly-test-key''',
  # Present in commit e06b508 only: a test fixture asserting the API does
  # not echo a key back to the client. Never a real credential, so nothing
  # to rotate. The current tests use tvly-test-key instead, and this entry
  # exists solely so the history scan stays clean without rewriting shared
  # history over a string that was always fake.
  '''tvly-secret-value-for-testing-only''',
  '''tvly-supersecret''',
  '''tvly-x''',
  '''sk-test''',
  '''sk-x''',
  '''brave-key''',
]

# Scoped to one file, and deliberately NOT a global entry.
#
# Commit c1f354e added parametrised fixtures asserting that the recording
# loader rejects credential-*shaped* values, which required such literals
# to exist. They were copied from this repository's own CI canary -- so
# allowlisting them globally made the canary's planted secrets invisible
# and silently disabled the positive control. The scan then reported "no
# leaks found" on a file full of planted credentials.
#
# condition = "AND" means a finding is ignored only when it is both one of
# these strings *and* in that test file. The canary writes planted.py, so
# it stays detectable. regexTarget = "match" is required because the rule's
# span includes the surrounding quotes; a secret-targeted entry matches
# nothing while looking correct.
#
# Nothing here was ever a real credential, so there is nothing to rotate.
[[allowlists]]
description = "Fake credential shapes committed in c1f354e's loader tests"
condition = "AND"
regexTarget = "match"
paths = ['''tests/unit/test_replay_mode\.py''']
regexes = [
  '''AbCdEfGhIjKlMnOpQrStUvWxYz0123456789''',
  '''tvly-AbCdEfGh01234567890123456789''',
  # Present in commit e029b2e only. A test asserting that a real key
  # shape inside a recording is still refused needed such a shape to
  # exist, and it was written as a whole literal rather than assembled
  # at runtime -- the mistake this module's _fake_credential() helper
  # exists to prevent. Fixed forward in the next commit; this entry
  # keeps the history scan clean without rewriting shared history over
  # a string that was never a credential.
  '''sk-AbCdEfGhIjKlMnOpQrStUvWxYz0123456789AbCdEfGh''',
  # Also e029b2e only: the URL slug that motivated the recordings entry
  # below. It was written across two source lines, so the line holding it
  # carries no scheme and the URL-context rule cannot see it. Matched on
  # the literal instead, still scoped to this one test file.
  '''sk-management-framework-toolkit-and-guide-2026''',
]

# Exact literals, not a pattern.
#
# A recording stores the URLs of pages the engine retrieved. One NIST run
# surfaced a page whose path slug begins "sk-man" -- "...risk-management-..."
# with the rule's `sk-` keyword landing mid-word -- which satisfies the broad
# OpenAI pattern.
#
# The first fix allowlisted any lowercase hyphenated `sk-` token appearing
# inside a URL in this directory. That is a blind spot: a real credential
# embedded in a URL, such as https://example.test/sk-proj-<lowercase body>,
# would have been waved through, and no canary covered it because the
# canary's file is not under recorded_runs/. The reasoning also rested on
# "real keys are always mixed-case", which is an assumption about a vendor's
# format rather than a property this repository controls.
#
# Replaced with the exact slugs actually present. A new false positive costs
# one line here; a leaked credential is no longer silently permitted.
[[allowlists]]
description = "Exact retrieved-URL slugs that collide with the sk- prefix"
condition = "AND"
regexTarget = "match"
paths = [
  '''src/agentic_research/web/recorded_runs/.*\.json$''',
  '''tests/unit/test_replay_mode\.py$''',
]
regexes = [
  '''sk\-management\-framework\-ai\-rmf\-1\-0''',
  '''sk\-management\-framework\-ai\-rmf\-1\-0\-vs\-gdpr''',
  '''sk\-management\-framework\-ai\-rmf\-1\-0\-vs\-iso\-9001''',
  '''sk\-management\-framework\-ai\-rmf\-1\-0\-vs\-nist\-sp\-800\-53\-rev\-5''',
]
