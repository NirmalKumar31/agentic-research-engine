# gitleaks configuration.
#
# Extends the default ruleset rather than replacing it, and adds rules for
# the providers this project actually uses. gitleaks ships no Tavily rule,
# so without the first rule below an accidentally committed search key would
# pass a "clean" scan.

[extend]
useDefault = true

[[rules]]
id = "tavily-api-key"
description = "Tavily API key"
regex = '''tvly-[A-Za-z0-9_-]{24,}'''
keywords = ["tvly-"]

[[rules]]
id = "openai-api-key-broad"
description = "OpenAI API key (project or legacy form)"
regex = '''sk-(proj-|svcacct-)?[A-Za-z0-9_-]{32,}'''
keywords = ["sk-"]

# Uses [[allowlists]] rather than the singular [allowlist]. The two cannot
# coexist -- gitleaks fails to load the config entirely, which surfaces as
# a scan that appears to run and reports whatever it likes. Worth knowing:
# a broken config does not look like a broken config.

[[allowlists]]
description = "Paths that are intentionally secret-shaped"
paths = [
  '''\.venv/''',
  '''\.env\.example$''',
  '''\.gitleaks\.toml$''',
]

[[allowlists]]
description = "Fake literals in test fixtures and historical commits"
regexes = [
  # Test fixtures. One exists specifically to assert that a secret is
  # redacted in logs, which requires a secret-shaped literal to exist.
  '''tvly-test-key''',
  # Present in commit e06b508 only: a test fixture asserting the API does
  # not echo a key back to the client. Never a real credential, so nothing
  # to rotate. The current tests use tvly-test-key instead, and this entry
  # exists solely so the history scan stays clean without rewriting shared
  # history over a string that was always fake.
  '''tvly-secret-value-for-testing-only''',
  '''tvly-supersecret''',
  '''tvly-x''',
  '''sk-test''',
  '''sk-x''',
  '''brave-key''',
]

# Scoped to one file, and deliberately NOT a global entry.
#
# Commit c1f354e added parametrised fixtures asserting that the recording
# loader rejects credential-*shaped* values, which required such literals
# to exist. They were copied from this repository's own CI canary -- so
# allowlisting them globally made the canary's planted secrets invisible
# and silently disabled the positive control. The scan then reported "no
# leaks found" on a file full of planted credentials.
#
# condition = "AND" means a finding is ignored only when it is both one of
# these strings *and* in that test file. The canary writes planted.py, so
# it stays detectable. regexTarget = "match" is required because the rule's
# span includes the surrounding quotes; a secret-targeted entry matches
# nothing while looking correct.
#
# Nothing here was ever a real credential, so there is nothing to rotate.
[[allowlists]]
description = "Fake credential shapes committed in c1f354e's loader tests"
condition = "AND"
regexTarget = "match"
paths = ['''tests/unit/test_replay_mode\.py''']
regexes = [
  '''AbCdEfGhIjKlMnOpQrStUvWxYz0123456789''',
  '''tvly-AbCdEfGh01234567890123456789''',
]

# Scoped to recorded runs, and requiring the token to sit inside a URL.
#
# A recording stores the URLs of the pages the engine retrieved. One NIST
# run surfaced a page whose path slug begins "sk-man..." -- almost
# certainly "...risk-management-..." with the rule's `sk-` keyword landing
# mid-word -- which satisfies the broad OpenAI pattern and produced six
# findings on a public URL.
#
# Deliberately not a blanket allowlist for this directory. That would hide
# a genuine key committed in a recording, which is exactly the mistake
# that disabled the CI canary once already. Three conditions must hold
# together: the file is a recorded run, the token appears inside an
# http(s) URL, and the token is entirely lowercase with hyphens in its
# body. Real OpenAI keys are mixed-case and carry no hyphen after the
# prefix, so a leaked one stays detectable here.
#
# The loader's own assert_no_secrets() is a second, independent check with
# a narrower pattern (no hyphens permitted), and is unaffected by this.
[[allowlists]]
description = "URL path slugs in recorded runs that collide with the sk- prefix"
condition = "AND"
regexTarget = "line"
paths = ['''src/agentic_research/web/recorded_runs/.*\.json$''']
regexes = ['''https?://[^"\s]*sk-[a-z0-9]+(-[a-z0-9]+)+''']
