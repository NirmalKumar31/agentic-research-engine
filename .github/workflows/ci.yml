name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Lint, types and tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Type check
        run: mypy src/agentic_research

      # No credentials are configured for this job, so any test that reaches a
      # paid API would fail rather than silently spend money. Integration tests
      # are deselected by marker and run separately.
      - name: Tests
        run: pytest -m "not integration and not ollama" --cov --cov-report=term-missing

  package:
    name: Build and verify a clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Installs the built wheel into a fresh environment and runs the CLI, so
      # a missing package or a broken entry point fails here rather than for
      # the first person who clones the repository.
      - name: Install the wheel and run the CLI
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/agentic-research --help
          LLM_MODE=local /tmp/fresh/bin/agentic-research graph | head -5
