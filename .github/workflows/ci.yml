name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Lint, types and tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # Unconstrained on purpose for the matrix job: this is a library and
        # the broad ranges in pyproject.toml need to keep working as
        # dependencies move. The container build uses constraints.txt.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Examples are linted too: they are code a reader will run.
      - name: Lint
        run: ruff check src tests examples

      - name: Format check
        run: ruff format --check src tests examples

      # Two invocations on purpose. Bare `mypy` uses the `packages` setting
      # in pyproject.toml, resolving imports the way an importer does; that
      # is what a contributor runs, and it catches package-resolution faults
      # a path-based run silently tolerates. The second checks the examples,
      # which are outside the package: ruff does not resolve attributes, so
      # a renamed field surfaces here rather than at runtime.
      - name: Type check
        run: |
          mypy
          mypy examples

      # No credentials are configured for this job, so any test that reaches a
      # paid API would fail rather than silently spend money. Integration tests
      # are deselected by marker and run separately.
      - name: Tests
        run: pytest -m "not integration and not ollama" --cov --cov-report=term-missing

  package:
    name: Build and verify a clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Installs the built wheel into a fresh environment and runs the CLI, so
      # a missing package or a broken entry point fails here rather than for
      # the first person who clones the repository.
      - name: Install the wheel and run the CLI
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          /tmp/fresh/bin/agentic-research --help
          LLM_MODE=local /tmp/fresh/bin/agentic-research graph | head -5

      # The public site runs from the installed wheel, not a source
      # checkout. If the recording JSON were not packaged, the deployed
      # demo would come up with nothing to show and the failure would
      # first appear on Render. Asserted here instead.
      # Cost reporting used to resolve pricing.toml by walking up from the
      # working directory, so an installed wheel run anywhere else silently
      # reported no price at all. Checked from /tmp for that reason.
      - name: Verify pricing resolves outside the repository
        run: |
          cd /tmp
          /tmp/fresh/bin/python - <<'PY'
          from agentic_research.config import Provider
          from agentic_research.llm.pricing import get_price
          price = get_price(Provider.OPENAI, "gpt-6-luna")
          assert price is not None, "pricing not resolvable from an installed wheel"
          print("pricing resolved outside the repo:", price)
          PY

      - name: Build the sdist and check for forbidden paths
        run: |
          python -m build --sdist
          python - <<'PY'
          import sys, tarfile, glob
          forbidden = ("node_modules", "/dist/", ".tsbuildinfo", "__pycache__",
                       ".pytest_cache", "outputs/", "checkpoints/", "htmlcov")
          path = sorted(glob.glob("dist/*.tar.gz"))[-1]
          names = tarfile.open(path).getnames()
          bad = [n for n in names if any(f in n for f in forbidden)]
          print(f"{len(names)} entries in {path}")
          if bad:
              print("forbidden paths in sdist:", bad[:20]); sys.exit(1)
          print("sdist clean")
          PY

      - name: Verify recordings ship inside the wheel
        run: |
          /tmp/fresh/bin/python - <<'PY'
          from agentic_research.web.recordings import RECORDINGS_DIR, available
          found = [s.id for s in available()]
          print(f"recordings dir: {RECORDINGS_DIR}")
          print(f"loaded: {found}")
          assert found, "no recordings in the installed wheel; check package data"
          PY

  docker:
    name: Build the image and run the CLI inside it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -t agentic-research:ci .

      # Exercises the entrypoint and a command that touches config, graph
      # construction and rendering, so a broken image fails here rather than
      # for whoever pulls it.
      - name: Run the CLI in the container
        run: |
          docker run --rm agentic-research:ci --help
          docker run --rm -e LLM_MODE=local agentic-research:ci graph | head -5
          docker run --rm -e LLM_MODE=local agentic-research:ci check

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: a key removed in a later commit is still a leaked
          # key, and a shallow clone would not see it.
          fetch-depth: 0

      # The CLI rather than the action: the action scans the commits in the
      # push, which silently scanned 14 of 20 commits here. A history scan
      # should mean the whole history, so the scope is stated explicitly.
      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/

      - name: Verify the scanner detects a planted secret
        # Without this, "no leaks found" could equally mean the ruleset is
        # broken. An earlier positive control passed silently because it
        # used an example key that gitleaks allowlists.
        #
        # The bodies are generated fresh each run rather than hard-coded.
        # A fixed canary value can be allowlisted -- which happened: test
        # fixtures copied these exact strings, an allowlist entry for them
        # made the planted secrets invisible, and the control was disabled
        # by a change that looked unrelated. A random body cannot be
        # allowlisted in advance by anyone, including us.
        run: |
          mkdir -p /tmp/canary && cd /tmp/canary && git init -q
          cp "$GITHUB_WORKSPACE/.gitleaks.toml" .
          printf 'K="tvly-%s"\nO="sk-proj-%s"\n' \
            "$(openssl rand -hex 16)" \
            "$(openssl rand -hex 20)" > planted.py
          git add -A && git -c user.email=t@t -c user.name=t commit -qm canary
          if gitleaks git --no-banner -c .gitleaks.toml --exit-code 1 . ; then
            echo "::error::secret scanner failed to detect planted credentials"
            exit 1
          fi
          echo "positive control passed: scanner detects provider keys"

      - name: Scan full history
        run: gitleaks git --no-banner --redact -c .gitleaks.toml --exit-code 1 .

  dependencies:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pip-audit
      - name: Audit
        # Skips the local package itself, which is not on PyPI.
        run: pip-audit --progress-spinner off --skip-editable

  frontend:
    name: Build the frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund

      # Production dependencies only: a vulnerability in a build-time tool
      # does not ship to a visitor, and failing on those trains people to
      # ignore the job.
      - name: Audit production dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build

  web-image:
    name: Build the web image and probe its health endpoint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: docker build -f Dockerfile.web -t agentic-research-web:ci .

      # Starts the service exactly as the host will and waits for /api/health.
      # A container that builds but cannot serve fails here rather than on
      # the deployed URL. No credentials, so demo mode runs with none.
      # Started with NO credentials, exactly as the public replay service
      # runs. If the image needed a key to boot, or shipped without its
      # recordings, that has to fail here rather than on the deployed URL.
      - name: Probe the replay service end to end
        run: |
          docker run -d --name web -p 8000:8000 \
            -e DEMO_MODE=true -e LLM_MODE=local -e LIVE_RESEARCH_ENABLED=false \
            agentic-research-web:ci
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/api/health > /tmp/health.json && break
            sleep 2
          done
          test -s /tmp/health.json || { docker logs web; exit 1; }
          cat /tmp/health.json; echo

          curl -sf http://127.0.0.1:8000/api/config > /tmp/config.json
          cat /tmp/config.json; echo

          curl -sf http://127.0.0.1:8000/api/examples > /tmp/examples.json
          python3 - <<'PY'
          import json, sys, urllib.request
          cfg = json.load(open("/tmp/config.json"))
          assert cfg["service_mode"] == "replay", cfg
          assert cfg["live_research_enabled"] is False, cfg
          assert cfg["local_models_available"] is False, cfg

          examples = json.load(open("/tmp/examples.json"))["examples"]
          assert examples, "the image shipped without its recordings"
          print("recordings in image:", [e["id"] for e in examples])
          assert any(e["has_pdf_evidence"] for e in examples), "no PDF recording in the image"

          rid = examples[0]["id"]
          base = "http://127.0.0.1:8000"
          full = json.load(urllib.request.urlopen(f"{base}/api/examples/{rid}"))
          assert full["recorded"] is True
          assert full["result"]["report"], "recording has no report"

          with urllib.request.urlopen(f"{base}/api/examples/{rid}/stream") as r:
              body = r.read().decode()
          assert "event: result" in body and "event: done" in body, "replay stream broken"

          # Paid execution must refuse without credentials, not error out.
          req = urllib.request.Request(
              f"{base}/api/research", method="POST",
              data=json.dumps({"query": "a genuine research question"}).encode(),
              headers={"content-type": "application/json"})
          try:
              urllib.request.urlopen(req); raise AssertionError("live research was not refused")
          except urllib.error.HTTPError as exc:
              assert exc.code == 403, exc.code
          print("replay service verified with zero credentials")
          PY

          # The app shell, asserted rather than eyeballed. This previously
          # read `curl -sf ... | head -c 120`, whose exit status is head's,
          # not curl's -- so the container served a JSON 404 at / while this
          # step stayed green and only /api/health was really being checked.
          code=$(curl -s -o /tmp/root.html -w '%{http_code}' http://127.0.0.1:8000/)
          echo "GET / -> $code"
          head -c 200 /tmp/root.html; echo
          test "$code" = "200" || { echo "the frontend is not being served"; docker logs web; exit 1; }
          grep -qi '<div id="root"' /tmp/root.html || {
            echo "/ did not return the app shell"; docker logs web; exit 1; }

          # A hashed asset, so a shell served without its bundle also fails.
          asset=$(grep -oE '/assets/[A-Za-z0-9._-]+\.js' /tmp/root.html | head -1)
          test -n "$asset" || { echo "no bundle referenced by the shell"; exit 1; }
          curl -sf "http://127.0.0.1:8000${asset}" -o /dev/null || {
            echo "bundle ${asset} is not served"; docker logs web; exit 1; }
          echo "frontend served: shell + ${asset}"
          docker rm -f web
