[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-research-engine"
version = "1.8.0"
description = "A multi-stage agentic research engine on LangGraph, with evidence-level provenance, bounded research loops, and hybrid cloud/local model routing."
readme = "README.md"
# Bounded rather than open-ended: CI tests 3.11 and 3.12, and the
# classifiers below claim exactly those. An unbounded floor invites an
# install on 3.13 that nothing has ever run.
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Nirmal Kumar" }]
keywords = ["langgraph", "agents", "research", "llm", "rag", "citations"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Version policy: LangGraph/LangChain moved to 1.x and renamed or removed a
# large part of the 0.x surface, so the floors below are real requirements
# rather than caution. Upper bounds stop at the next major only.
dependencies = [
    "tldextract==5.3.2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.6,<2",
    "langchain-ollama>=1.1,<2",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "httpx>=0.28,<0.29",
    "trafilatura>=2.2,<3",
    "pypdf>=6,<7",
    "tenacity>=9.1,<10",
    "structlog>=26,<27",
    "typer>=0.27,<1",
    "rich>=15,<16",
]

[project.optional-dependencies]
nli-local = [
    # The local semantic verifier. Not a core dependency: the hosted web
    # image must stay small enough for a 512MB plan, and the measured
    # peak for this checkpoint is about 1.3GB. Install this for local
    # research, or point NLI_MODE=remote at an endpoint.
    "torch>=2.4,<3",
    "transformers>=5,<6",
    "safetensors>=0.5,<1",
    "sentencepiece>=0.2,<1",
]

nli-remote = [
    # Truncation detection for the managed endpoint, which reports a
    # label and a score and nothing else. Pure Rust, about 3MB, and no
    # torch: the point of remote mode is a host that cannot hold the
    # checkpoint, so pulling transformers back in to count tokens would
    # defeat it. Measured identical to the transformers tokenizer on
    # the >512 decision across 263 pairs.
    "tokenizers>=0.20,<1",
]

web = [
    "fastapi>=0.120,<1",
    "uvicorn[standard]>=0.40,<1",
    # The hosted web service runs NLI_MODE=remote, so it needs the
    # tokenizer for the same reason nli-remote does.
    "tokenizers>=0.20,<1",
    # The durable daily quota. Not optional for a live deployment: the
    # in-memory counter bounds a process, and a Render instance that
    # sleeps when idle starts each morning with a fresh one. Present in
    # the image so the store is reachable, and DEMO_QUOTA_REQUIRED
    # decides whether its absence refuses runs.
    "redis>=5,<7",
]
dev = [
    # Not a runtime dependency and deliberately not one: no encoding is
    # published for this project's configured models, so the engine
    # cannot use it to count. It is here so the tests can demonstrate,
    # against a real byte-level BPE, that the byte bound is never below
    # a true token count. Without it those tests skip and the one
    # property that matters goes unverified in CI.
    "tiktoken>=0.9,<1",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7,<8",
    "respx>=0.23,<0.24",
    # Parses render.yaml and render-live.yaml so the deployment ceilings
    # are asserted rather than reviewed by eye. Present transitively today,
    # which is not the same as declared: CI installs only this extra.
    "pyyaml>=6,<7",
    # Generates an in-process CA so TLS certificate verification can be
    # tested for real. The pinning design connects by IP and verifies
    # against the hostname via SNI; that property cannot be asserted
    # without a genuine certificate, and verify=False would make the
    # assertions vacuous.
    "trustme>=1.2,<2",
    "fastapi>=0.120,<1",
    "uvicorn[standard]>=0.40,<1",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<3",
]

[project.scripts]
agentic-research = "agentic_research.cli.main:app"

[project.urls]
Repository = "https://github.com/NirmalKumar31/agentic-research-engine"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_research"]
# Build output and caches can appear inside the package directory during
# development; none of it belongs in a distribution.
exclude = ["**/__pycache__", "**/*.pyc", "**/.DS_Store"]

[tool.hatch.build.targets.sdist]
# An sdist should carry what is needed to build and test, and nothing that
# is regenerated. node_modules alone is hundreds of megabytes.
include = [
  "src/",
  "tests/",
  "examples/",
  "docs/",
  "web/src/",
  "web/index.html",
  "web/package.json",
  "web/package-lock.json",
  "web/tsconfig.json",
  "web/vite.config.ts",
  "pyproject.toml",
  "constraints.txt",
  "constraints-dev.txt",
  "pricing.toml",
  "README.md",
  "LICENSE",
  "Dockerfile",
  "Dockerfile.web",
  "render.yaml",
  "deploy/",
]
exclude = [
  "web/node_modules",
  "web/dist",
  "**/*.tsbuildinfo",
  "**/__pycache__",
  "**/*.pyc",
  "**/.DS_Store",
  ".pytest_cache",
  ".mypy_cache",
  ".ruff_cache",
  "outputs/",
  "checkpoints/",
  "evaluations/",
  "htmlcov/",
  ".coverage",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ASYNC"]
ignore = [
    "B008",   # typer uses function calls (Option/Argument) in argument defaults
    "RUF012", # ClassVar annotations not required on pydantic-style class attrs
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["agentic_research"]
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true

# Third-party packages without bundled type information.
[[tool.mypy.overrides]]
module = ["trafilatura.*", "langchain_ollama.*", "psutil", "redis", "redis.*", "tokenizers", "tokenizers.*"]
ignore_missing_imports = true

# torch ships type information, so mypy follows it into numpy, whose
# stubs use 3.12+ `type` statements while this project targets 3.11 --
# which aborts the whole check. Neither is called directly here; the NLI
# adapter imports them inside functions and treats their surface as Any.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "torch", "transformers"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Default runs are hermetic and free: no network, no credentials, no local
# server. Opt in with `pytest -m ollama` or `pytest -m integration`.
addopts = "-q --strict-markers -m 'not integration and not ollama and not nli and not hosted_nli'"
markers = [
    "integration: requires live API credentials; excluded from default runs",
    "ollama: requires a running local Ollama server",
    "nli: downloads and runs the real NLI checkpoint; excluded from default runs",
    "hosted_nli: calls a live private inference endpoint that bills hourly; needs NLI_TEST_ENDPOINT",
]

[tool.coverage.run]
source = ["src/agentic_research"]
branch = true
